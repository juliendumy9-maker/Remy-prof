<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Remy Prof</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0A12;
  --bg-card:#15151F;
  --bg-raised:#1E1E2C;
  --gold:#D9A93B;
  --gold-soft:#EFCB74;
  --violet:#7C5CFA;
  --violet-soft:#9B85FF;
  --text:#F2F0E6;
  --text-muted:#8D8FA0;
  --border: rgba(124,92,250,0.18);
  --font-display: 'Poppins', sans-serif;
  --font-body: 'Inter', -apple-system, sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; background:var(--bg); color:var(--text); font-family:var(--font-body); height:100%; overflow:hidden;}
body{display:flex; flex-direction:column; height:100vh; height:100dvh;}

.topbar{flex-shrink:0; background:linear-gradient(180deg, #0D0D18 0%, #0A0A12 100%); border-bottom:1px solid var(--border); padding:14px 16px; display:flex; align-items:center; justify-content:space-between;}
.topbar h1{font-family:var(--font-display); font-size:19px; font-weight:800; background:linear-gradient(135deg, var(--violet-soft), var(--gold-soft)); -webkit-background-clip:text; background-clip:text; color:transparent; margin:0;}
.clear-btn{background:var(--bg-raised); border:1px solid var(--border); color:var(--text-muted); border-radius:10px; padding:8px 12px; font-size:12px; font-weight:700;}

.chat-scroll{flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px;}

.bubble-row{display:flex; gap:8px; max-width:88%;}
.bubble-row.user{align-self:flex-end; flex-direction:row-reverse;}
.bubble-row.ai{align-self:flex-start;}
.avatar{width:28px; height:28px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:14px; margin-top:2px;}
.avatar.ai-av{background:linear-gradient(135deg, var(--violet-soft), var(--violet));}
.avatar.user-av{background:var(--bg-raised); border:1px solid var(--border);}
.bubble{padding:12px 15px; border-radius:16px; font-size:15px; line-height:1.5; white-space:pre-wrap; word-break:break-word;}
.bubble-row.user .bubble{background:var(--violet); color:#fff; border-bottom-right-radius:4px;}
.bubble-row.ai .bubble{background:var(--bg-card); border:1px solid var(--border); border-bottom-left-radius:4px;}

.empty-hint{text-align:center; color:var(--text-muted); padding:60px 24px; font-size:14px; line-height:1.6;}
.empty-hint .big{font-size:40px; margin-bottom:14px;}

.typing-dots{display:flex; gap:4px; padding:14px 15px;}
.typing-dots span{width:7px; height:7px; border-radius:50%; background:var(--violet-soft); animation:bounce 1.2s infinite;}
.typing-dots span:nth-child(2){animation-delay:0.15s;}
.typing-dots span:nth-child(3){animation-delay:0.3s;}
@keyframes bounce{0%,60%,100%{transform:translateY(0); opacity:0.5;} 30%{transform:translateY(-5px); opacity:1;}}

.error-bubble{background:rgba(193,68,60,0.14); border:1px solid rgba(193,68,60,0.4); color:#E0645A; border-radius:12px; padding:11px 14px; font-size:13px; display:flex; align-items:center; justify-content:space-between; gap:10px;}
.retry-link{background:none; border:none; color:#E0645A; font-weight:800; text-decoration:underline; font-size:13px; flex-shrink:0;}

.input-bar{flex-shrink:0; background:var(--bg-card); border-top:1px solid var(--border); padding:10px 12px calc(10px + env(safe-area-inset-bottom)); display:flex; gap:8px; align-items:flex-end;}
.input-bar textarea{flex:1; background:var(--bg-raised); border:1px solid var(--border); color:var(--text); border-radius:20px; padding:12px 16px; font-size:15px; font-family:var(--font-body); resize:none; outline:none; max-height:120px; line-height:1.4;}
.input-bar textarea:focus{border-color:var(--violet);}
.send-btn{width:44px; height:44px; border-radius:50%; background:var(--violet); border:none; color:#fff; font-size:18px; flex-shrink:0; display:flex; align-items:center; justify-content:center;}
.send-btn:disabled{opacity:0.35;}
</style>
</head>
<body>
  <div class="topbar">
    <h1>🎓 Remy Prof</h1>
    <button class="clear-btn" id="clearBtn">🗑️ Efase</button>
  </div>
  <div class="chat-scroll" id="chatScroll"></div>
  <div class="input-bar">
    <textarea id="msgInput" placeholder="Poze nenpòt kesyon..." rows="1"></textarea>
    <button class="send-btn" id="sendBtn">➤</button>
  </div>

<script>
let messages = []; // {role:'user'|'assistant', content:string}
let loading = false;

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

/* ============ STORAGE ============ */
async function loadChat(){
  try{
    if(window.storage){
      const res = await window.storage.get('remy-prof-chat', false);
      if(res && res.value) messages = JSON.parse(res.value);
    }
  } catch(e){ messages = []; }
}
async function saveChat(){
  try{
    if(window.storage) await window.storage.set('remy-prof-chat', JSON.stringify(messages), false);
  } catch(e){ /* keep in memory only */ }
}

/* ============ RENDER ============ */
function render(){
  const el = document.getElementById('chatScroll');
  if(messages.length === 0 && !loading){
    el.innerHTML = '<div class="empty-hint"><div class="big">🎓</div><p>Poze m nenpòt kesyon lekòl — matematik, syans, istwa, lang...<br>M ap reponn ou dirèkteman anba a.</p></div>';
    return;
  }
  let html = '';
  messages.forEach(m=>{
    if(m.error){
      html += '<div class="bubble-row ai"><div class="avatar ai-av">⚡</div><div class="error-bubble">⚠️ ' + escapeHtml(m.content || 'Repons lan pa t rive.') + ' <button class="retry-link" data-retry="1">Eseye ankò</button></div></div>';
      return;
    }
    const cls = m.role === 'user' ? 'user' : 'ai';
    const av = m.role === 'user' ? '<div class="avatar user-av">🙂</div>' : '<div class="avatar ai-av">⚡</div>';
    html += '<div class="bubble-row ' + cls + '">' + av + '<div class="bubble">' + escapeHtml(m.content) + '</div></div>';
  });
  if(loading){
    html += '<div class="bubble-row ai"><div class="avatar ai-av">⚡</div><div class="bubble typing-dots"><span></span><span></span><span></span></div></div>';
  }
  el.innerHTML = html;
  el.scrollTop = el.scrollHeight;

  document.querySelectorAll('[data-retry]').forEach(btn=>{
    btn.addEventListener('click', retryLast);
  });
}

/* ============ SEND MESSAGE ============ */
async function sendMessage(){
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if(!text || loading) return;
  messages.push({role:'user', content:text});
  input.value = '';
  input.style.height = 'auto';
  render();
  await callAI();
}

async function retryLast(){
  messages = messages.filter(m => !m.error);
  render();
  await callAI();
}

async function callAI(){
  loading = true;
  render();
  document.getElementById('sendBtn').disabled = true;

  try{
    const apiMessages = messages.filter(m=>!m.error).map(m=>({role:m.role, content:m.content}));
    const response = await fetch('/.netlify/functions/ask', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ messages: apiMessages })
    });
    const data = await response.json();
    if(!response.ok || data.error) throw new Error(data.error || ('HTTP ' + response.status));
    messages.push({role:'assistant', content:data.text});
    saveChat();
  } catch(e){
    messages.push({role:'assistant', content:e.message || 'Erè enkoni', error:true});
  } finally {
    loading = false;
    document.getElementById('sendBtn').disabled = false;
    render();
  }
}

/* ============ INPUT HANDLING ============ */
const inputEl = document.getElementById('msgInput');
inputEl.addEventListener('input', ()=>{
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
});
inputEl.addEventListener('keydown', e=>{
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});
document.getElementById('sendBtn').addEventListener('click', sendMessage);
document.getElementById('clearBtn').addEventListener('click', ()=>{
  if(!confirm('Efase tout konvèsasyon an?')) return;
  messages = [];
  saveChat();
  render();
});

/* ============ INIT ============ */
(async function init(){
  await loadChat();
  render();
})();
</script>
</body>
</html>
